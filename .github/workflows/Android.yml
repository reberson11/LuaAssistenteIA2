
name: Build APK Lua

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar AndroidManifest
        run: |
          echo "Conteudo do AndroidManifest.xml:"
          cat -n app/src/main/AndroidManifest.xml

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace --info

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lua-Assistente-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
